# =============================================================================
# STC-CapsNet: Default Configuration
# =============================================================================

model:
  name: "STC-CapsNet"

  # Temporal Convolution (1D)
  temporal_conv:
    in_channels: 1
    channels: [64, 128, 256]
    kernel_sizes: [7, 5, 3]
    dropout: 0.2

  # Spectral Convolution (2D)
  spectral_conv:
    in_channels: 256
    channels: [128, 256]
    kernel_sizes: [[3, 3], [3, 3]]
    dropout: 0.2

  # Primary Capsules
  primary_capsules:
    in_channels: 256
    num_capsules: 8
    capsule_dim: 32
    kernel_size: 9
    stride: 2

  # Higher Capsules (Digit Capsules)
  higher_capsules:
    num_capsules: 2          # real / fake
    capsule_dim: 16
    routing_iterations: 3

# Audio Preprocessing
audio:
  sample_rate: 16000
  duration: 3.0              # seconds
  noise_reduction: true

# Feature Extraction
features:
  type: "mel"                # "mel" or "grayscale"
  n_fft: 2048
  hop_length: 512
  n_mels: 128
  image_size: [128, 128]

# Training
training:
  epochs: 100
  batch_size: 32
  optimizer:
    name: "adam"
    lr: 0.001
    weight_decay: 0.00001
  scheduler:
    name: "reduce_on_plateau"
    factor: 0.1
    patience: 5
  loss:
    name: "margin"
    m_plus: 0.9
    m_minus: 0.1
    lambda_val: 0.5
  early_stopping:
    patience: 10
  augmentation:
    time_shift: true
    pitch_shift: true

# Data Split
data:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  num_workers: 4
  pin_memory: true

# Logging
logging:
  log_interval: 50
  save_interval: 5
  tensorboard: true

seed: 42
device: "cuda"
